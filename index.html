<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>動画同期コメントオーバーレイ</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel" aria-label="操作パネル">
        <div class="brand">
          <div>
            <h1>設定</h1>
            <p>入力元、表示方式、レーン数を調整します。</p>
          </div>
          <button id="closeSettings" class="icon-button" type="button" aria-label="設定を閉じる">×</button>
        </div>

        <div class="control-grid">
          <label>
            YouTube URL
            <input id="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=...">
          </label>
          <button id="loadYoutube" type="button">YouTubeを読込</button>

          <label>
            Discord URL
            <input id="discordUrl" type="url" placeholder="https://discord.com/channels/server/channel">
          </label>

          <label>
            動画開始日時
            <input id="videoStartAt" type="datetime-local">
          </label>

          <label>
            ローカル動画
            <input id="videoFile" type="file" accept="video/*">
          </label>

          <label>
            コメントJSON
            <input id="commentFile" type="file" accept="application/json,.json">
          </label>

          <label>
            Discord raw NDJSON
            <input id="ndjsonFile" type="file" accept=".ndjson,.jsonl,text/plain">
          </label>

          <label>
            表示モード
            <select id="mode">
              <option value="bubble">吹き出し</option>
              <option value="danmaku">弾幕</option>
              <option value="ticker">ティッカー</option>
              <option value="popup">ポップアップ</option>
            </select>
          </label>

          <label>
            デザイン
            <select id="designPreset">
              <option value="line">LINE風</option>
              <option value="niconico">ニコニコ動画風</option>
              <option value="discord">Discord風</option>
              <option value="subtitle">字幕ポップアップ風</option>
            </select>
          </label>

          <label>
            画面モード
            <select id="screenMode">
              <option value="overlay">動画オーバーレイ</option>
              <option value="discordReplay">Discord再現</option>
            </select>
          </label>

          <label>
            コメント一覧
            <select id="listLayout">
              <option value="side">右側に固定</option>
              <option value="drawer">下から引き出し</option>
              <option value="hidden">隠す</option>
            </select>
          </label>

          <label>
            表示位置
            <select id="commentPosition">
              <option value="auto">自動レーン</option>
              <option value="top">上寄せ</option>
              <option value="middle">中央</option>
              <option value="bottom">下寄せ</option>
              <option value="left">左寄せ</option>
              <option value="right">右寄せ</option>
            </select>
          </label>

          <label>
            テーマ
            <select id="theme">
              <option value="dark">ダーク</option>
              <option value="soft">ソフト</option>
              <option value="studio">スタジオ</option>
            </select>
          </label>

          <label>
            開始オフセット秒
            <input id="offset" type="number" value="0" step="0.1">
          </label>

          <label>
            表示秒数
            <input id="duration" type="number" value="7" min="1" max="30" step="0.5">
          </label>

          <label>
            レーン数
            <input id="lanes" type="number" value="5" min="1" max="10" step="1">
          </label>

          <label>
            文字サイズ
            <input id="fontSize" type="range" value="15" min="12" max="44" step="1">
          </label>

          <label>
            吹き出し幅
            <input id="bubbleWidth" type="range" value="560" min="260" max="900" step="10">
          </label>

          <label>
            同時表示数
            <input id="maxVisible" type="number" value="8" min="1" max="40" step="1">
          </label>

          <label class="checkbox-row">
            <input id="showAvatars" type="checkbox" checked>
            avatarを表示
          </label>

          <div class="preset-box" aria-label="プリセット">
            <label>
              プリセット
              <select id="presetSelect"></select>
            </label>
            <label>
              保存名
              <input id="presetName" type="text" placeholder="line-soft">
            </label>
            <div class="button-row">
              <button id="savePreset" type="button">保存</button>
              <button id="exportPreset" type="button">書き出し</button>
            </div>
            <label>
              読み込み
              <input id="presetImport" type="file" accept="application/json,.json">
            </label>
          </div>
        </div>
      </section>

      <section class="stage" aria-label="動画とコメント表示">
        <div class="stage-topbar">
          <div class="brand compact">
            <h1>動画同期コメントオーバーレイ</h1>
            <p id="status">サンプルコメントを読込済み</p>
            <span id="versionBadge" class="version-badge">version loading</span>
          </div>
          <button id="toggleSettings" type="button">設定</button>
        </div>

        <div class="player-stack">
          <div id="videoHost" class="video-host">
            <video id="localVideo" controls playsinline></video>
            <iframe id="youtubeFrame" title="YouTube video player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            <div class="empty-video">
              <strong>動画を指定してください</strong>
              <span>YouTube URLまたはローカル動画ファイルを読み込めます。</span>
            </div>
          </div>
          <div id="overlay" class="overlay bubble" aria-live="polite"></div>
          <section id="discordReplay" class="discord-replay" aria-label="Discord再現画面">
            <div class="discord-server-rail" aria-hidden="true">
              <span class="server-dot active">N</span>
              <span class="server-dot">D</span>
              <span class="server-dot">+</span>
            </div>
            <div class="discord-channel-rail">
              <div class="discord-channel-title">Nexus AI</div>
              <button class="discord-channel active" type="button"># meeting-chat</button>
              <button class="discord-channel" type="button"># materials</button>
              <button class="discord-channel" type="button"># archive</button>
              <div class="discord-voice-box">LIVE / replay</div>
            </div>
            <div class="discord-chat">
              <header class="discord-chat-header">
                <strong># meeting-chat</strong>
                <span id="discordReplayClock">00:00.0</span>
              </header>
              <div id="discordReplayList" class="discord-message-list"></div>
              <div class="discord-composer">Message #meeting-chat</div>
            </div>
          </section>
          <div id="timelineDrawer" class="timeline-drawer" aria-label="コメントタイムライン"></div>
        </div>

        <div class="youtube-controls" aria-label="コメント再生コントロール">
          <input id="seekBar" class="seek-bar" type="range" min="0" max="100" step="0.1" value="0" aria-label="コメントタイムラインをシーク">
          <div class="transport">
            <button id="playPause" class="play-button" type="button">コメント再生</button>
            <button id="restart" type="button">最初から</button>
            <span id="clock">00:00.0</span>
            <span id="timeReadout">00:00.0 / 00:00.0</span>
          </div>
          <div class="recording-controls" aria-label="録画コントロール">
            <label>
              録画品質
              <select id="recordQuality">
                <option value="1080p">Full HD 1080p</option>
                <option value="720p">HD 720p</option>
                <option value="1440p">QHD 1440p</option>
                <option value="source">画面に合わせる</option>
              </select>
            </label>
            <label>
              fps
              <select id="recordFps">
                <option value="30">30</option>
                <option value="60">60</option>
                <option value="24">24</option>
              </select>
            </label>
            <label>
              bitrate Mbps
              <input id="recordBitrate" type="number" value="12" min="2" max="80" step="1">
            </label>
            <label>
              codec
              <select id="recordCodec">
                <option value="auto">自動</option>
                <option value="vp9">VP9</option>
                <option value="vp8">VP8</option>
                <option value="webm">WebM標準</option>
              </select>
            </label>
            <button id="checkRecording" type="button">録画診断</button>
            <button id="startRecording" type="button">画面録画開始</button>
            <button id="stopRecording" type="button" disabled>録画停止</button>
            <button id="downloadRecording" type="button" disabled>WebM保存</button>
            <span id="recordingStatus">録画待機中</span>
          </div>
        </div>
      </section>

      <aside class="comment-panel" aria-label="コメント一覧">
        <div class="comment-panel-header">
          <h2>コメント一覧</h2>
          <span id="commentCount">0件</span>
        </div>
        <form id="commentEditor" class="comment-editor" aria-label="コメント編集">
          <strong id="editorTitle">コメントを選択</strong>
          <label>
            時刻 秒
            <input id="editTime" type="number" step="0.1" min="0">
          </label>
          <label>
            表示名
            <input id="editAuthor" type="text">
          </label>
          <label>
            本文
            <textarea id="editText" rows="3"></textarea>
          </label>
          <label class="checkbox-row">
            <input id="editHidden" type="checkbox">
            このコメントを非表示
          </label>
          <div class="button-row">
            <button id="applyCommentEdit" type="submit">反映</button>
            <button id="clearCommentEdit" type="button">選択解除</button>
          </div>
        </form>
        <div id="commentList" class="comment-list"></div>
      </aside>
    </main>

    <script src="src/version.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
