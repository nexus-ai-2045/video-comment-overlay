<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>コメント取得</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <h1>コメント取得</h1>
        <p id="tabInfo">対象タブを確認中</p>
      </header>

      <label>
        配信元
        <select id="platform">
          <option value="auto">自動判定</option>
          <option value="discord">Discord</option>
          <option value="youtube">YouTube Live</option>
          <option value="twitch">Twitch</option>
        </select>
      </label>

      <label>
        動画開始日時
        <input id="videoStartAt" type="datetime-local">
      </label>

      <button id="captureVisible" type="button">表示中コメントを取得</button>

      <section id="rangePanel" class="range-panel" hidden>
        <div class="range-grid">
          <label>
            保存開始
            <input id="rangeStart" type="number" min="1" value="1">
          </label>
          <label>
            保存終了
            <input id="rangeEnd" type="number" min="1" value="1">
          </label>
        </div>
        <div id="rangeSummary" class="range-summary">範囲未選択</div>
        <ol id="previewList" class="preview-list"></ol>
      </section>

      <button id="downloadJson" type="button" disabled>JSON保存</button>

      <section class="result-card" aria-live="polite">
        <strong id="resultCount">未取得</strong>
        <span id="status">現在のタブでコメントが見えている状態にしてから取得します。</span>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
